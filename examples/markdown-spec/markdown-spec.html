<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spec using Markdown directives</title>
    <script class="remove">
      // All config options at https://respec.org/docs/
      var respecConfig = {
        format: "markdown",
        // Working Groups ids at https://respec.org/w3c/groups/
        group: "aria",
        specStatus: "unofficial",
        editors: [
          {
            name: "Your Name",
            url: "http://your-site.com",
          },
        ],
        github: {
          branch: "main",
          repoURL: "daniel-montalvo/respec",
        },
        // See https://respec.org/docs/#xref for usage.
        xref: "web-platform",
      };
    </script>
    <script src="/builds/respec-w3c.js" async class="remove"></script>
  </head>
  <body>
    <section
      id="abstract"
      data-include="abstract.md"
      data-include-format="markdown"
    ></section>
    <section
      id="sotd"
      data-include="sotd.md"
      data-include-format="markdown"
    ></section>
    <section
      id="introduction"
      data-include="introduction.md"
      data-include-format="markdown"
    ></section>
    <section id="conformance"></section>
  </body>
</html>
